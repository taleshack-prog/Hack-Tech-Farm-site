<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Hack Tech Farm</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0F1A">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <main class="login-wrap">
    <p class="center" style="margin-bottom:26px">
      <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true">HTF</span> Hack Tech Farm</a>
    </p>

    <div class="login-box">
      <h1>Área restrita</h1>
      <p>Entre para gerenciar produtos e atualizações.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
        <p class="form-msg" id="login-msg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <p class="center dim" style="font-size:.84rem;margin-top:22px">
      <a href="index.html">Voltar para o site</a>
    </p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js" defer></script>
</body>
</html>
