<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Hack Tech Farm</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0F1A">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <main class="login-wrap">
    <p class="center" style="margin-bottom:26px">
      <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true">HTF</span> Hack Tech Farm</a>
    </p>

    <div class="login-box">
      <h1>Área restrita</h1>
      <p>Entre com a conta do GitHub que tem acesso ao repositório do site.</p>

      <a href="/api/auth/login" class="btn btn-primary" id="login-btn" style="width:100%">
        Entrar com GitHub
      </a>

      <p class="form-msg" id="login-msg" role="status" aria-live="polite"></p>

      <p class="dim" style="font-size:.84rem;margin-top:20px;text-align:left">
        Não há senha para lembrar nem para vazar. Quem pode escrever no
        repositório pode publicar no site — e cada alteração fica registrada
        no seu nome.
      </p>
    </div>

    <p class="center dim" style="font-size:.84rem;margin-top:22px">
      <a href="index.html">Voltar para o site</a>
    </p>
  </main>

  <script src="js/login.js" defer></script>
</body>
</html>
